name: Test
on:
  - push
  - pull_request
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions
      - name: Run test
        run: npm test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions
      - name: Run lint
        run: npm run lint
      - name: Run TypeScript Check
        run: npx tsc --noEmit
  deploy:
    name: Deploy
    needs: [test, lint]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions
      - name: Restore .env file from secrets
        run: echo "${{secrets.FUNCTIONS_DOTENV}}" > functions/.env
      # Run firebase-tools on the runner's Node.js 22 instead of w9jds/firebase-action,
      # whose container ships Node.js 20.15 and cannot require() ESM-only deps (jose via firebase-admin 14)
      - name: Deploy to Firebase
        run: npx --yes firebase-tools@13.15.4 deploy --non-interactive
        env:
          FIREBASE_TOKEN: ${{secrets.FIREBASE_TOKEN}}
